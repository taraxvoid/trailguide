# Tool versions for local development (`mise install`). CI installs bun from
# .bun-version; keep the two in step.
[tools]
bun = "1.4.2"
just = "1.58.0"
gitleaks = "8.30.1"

# Renders tailored resume PDFs; bump deliberately, Typst output changes between minors.
typst = "0.15.1"

# Git hooks (lefthook.yml) and the checks they run.
lefthook = "2.2.1"
jactionlint = "2.1.0"

# Used by jactionlint to check `run:` scripts.
shellcheck = "0.11.0"
