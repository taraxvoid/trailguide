<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"AI Deployment Engineer","description":"\u003cstrong>About OpenAI Foundation\u003c/strong>\u003cp>AI is already changing how people work, learn, and access care. It has the potential to unlock extraordinary benefits—faster medical breakthroughs, accelerated scientific discovery, more personalized services in healthcare and education, new tools for creativity and invention, higher productivity and economic growth, improved public services like transportation systems, and so much more.\u003c/p>\u003cp>But building powerful systems to benefit humanity is only a part of the work of our mission. Advanced AI models will also present new challenges that are already surfacing, and we need to be prepared to identify these challenges and develop solutions to address them.\u003c/p>\u003cp>These are the two dimensions of what we’re building the Foundation to do. We aim to enable the use of AI to find solutions to humanity’s hardest problems, transform what people are capable of, and deliver real benefits in people’s lives—while working hard with partners to be ready for new challenges, and to help make society resilient, as AI advances.\u003c/p>\u003cp>This work is just beginning. Over the next year, as we quickly ramp up, the Foundation expects to invest at least $1 billion across life sciences and curing diseases, jobs and economic impact, AI resilience, and community programs.  This includes early investments toward our previously announced $25 billion commitment to curing diseases and AI resilience.\u003c/p>\u003cstrong>About the role\u003c/strong>\u003cp>Frontier AI can, and must, benefit all of humanity. This requires genuine engagement and co-design with the communities and institutions doing the world's most important work on the ground. The OpenAI Foundation will fund high-impact nonprofits to expand their impact with AI, but funding alone will not be sufficient. Technical talent can help turn Foundation grants into successful real-world deployments.\u003c/p>\u003cp>We are seeking an AI Deployment Engineer to advise Foundation grantees on how to identify, implement, and scale AI use cases that transform their work and impact. You'll work directly with nonprofit leaders and technical teams, helping them move from idea to prototype to production while choosing (or building) the AI tools that best fit their needs.\u003c/p>\u003cp>As an early technical hire for the Foundation, you will also flex to support emerging needs across the organization. This may include pressure-testing technical assumptions before grant approval, prototyping internal workflows, building tools for the world's first AI-native philanthropy, and translating lessons from grantee deployments into repeatable implementation guidance for the broader nonprofit sector.\u003c/p>\u003cp>This role is based in San Francisco. We use a hybrid work model of 3 days in the office per week.\u003c/p>\u003cstrong>In this role, you will\u003c/strong>\u003cul>\u003cli>\u003cp>Partner closely with high-impact nonprofit grantees as a technical thought partner, helping them identify practical AI use cases and move from ideation to successful deployment.\u003c/p>\u003c/li>\u003cli>\u003cp>Advise nonprofits on tool selection, implementation architecture, workflow redesign, evaluation, safety, data handling, and change management.\u003c/p>\u003c/li>\u003cli>\u003cp>Prototype alongside grantees, building demonstrations, reference implementations, integrations, and lightweight production systems that make AI adoption concrete.\u003c/p>\u003c/li>\u003cli>\u003cp>Pressure-test technical assumptions during grant design and due diligence so Foundation funding is matched with credible implementation paths.\u003c/p>\u003c/li>\u003cli>\u003cp>Develop reusable tools that help nonprofits and philanthropies deploy AI responsibly and effectively.\u003c/p>\u003c/li>\u003cli>\u003cp>Synthesize insights from grantee work into feedback for the Foundation's product, tooling, and grantmaking strategy.\u003c/p>\u003c/li>\u003cli>\u003cp>Build strong relationships across the nonprofit and philanthropy ecosystem, serving as a trusted technical advisor to organizations working on urgent human needs.\u003c/p>\u003c/li>\u003c/ul>\u003cstrong>You'll thrive in this role if you\u003c/strong>\u003cul>\u003cli>\u003cp>Have 5+ years of experience as a software engineer, ideally in a forward-deployed, solutions, or customer-facing engineering setting; experience as a founder or founding engineer is highly valued.\u003c/p>\u003c/li>\u003cli>\u003cp>Strong coder with demonstrated proficiency in programming languages such as Python, Java, C++, TypeScript/JavaScript\u003c/p>\u003c/li>\u003cli>\u003cp>Have a strong grasp of AI/LLM tools and best practices in real world applications, having built tooling, data infrastructure, evals, or agent harnesses that turn messy real-world data into something usable and trustworthy\u003c/p>\u003c/li>\u003cli>\u003cp>Can communicate clearly with both technical and nontechnical audiences and translate organizational goals into concrete technical plans.\u003c/p>\u003c/li>\u003cli>\u003cp>Are energized by an unfamiliar technical domain and have a track record of going deep fast.\u003c/p>\u003c/li>\u003cli>\u003cp>Bring strong product instincts, user empathy, and a pragmatic sense of what will actually work inside resource-constrained organizations.\u003c/p>\u003c/li>\u003cli>\u003cp>Own problems end-to-end and are willing to pick up whatever knowledge you’re missing to get the job done.\u003c/p>\u003c/li>\u003cli>\u003cp>Are an effective, high throughput operator who can drive multiple concurrent projects, prioritize ruthlessly, and operate independently with little oversight.\u003c/p>\u003c/li>\u003cli>\u003cp>Have a humble attitude, an eagerness to help colleagues and partners, and a desire to make the broader mission succeed.\u003c/p>\u003c/li>\u003c/ul>\u003cp>Experience with nonprofits, public-interest technology, grantmaking, education, healthcare, economic opportunity, scientific research, or civic institutions is desirable but not required.\u003c/p>\u003cstrong>Compensation\u003c/strong>\u003cp>The annual base salary range for this role is $350,000 to $450,000 USD.\u003c/p>\u003cp>This range reflects our good-faith estimate of the base salary we reasonably expect to pay for this position upon hire. Actual base salary will be determined based on job-related factors, including the candidate’s relevant experience, skills, expertise, the scope of the role, and work location, as applicable.\u003c/p>\u003cp>This salary range does not include benefits or any other compensation for which the role may be eligible.\u003c/p>\u003cstrong>Equal Opportunity\u003c/strong>\u003cp>We are an equal opportunity employer and do not discriminate on the basis of race, religion, national origin, gender, sexual orientation, age, veteran status, disability or any other legally protected status. Pursuant to the San Francisco Fair Chance Ordinance, we will consider qualified applicants with arrest and conviction records.\u003c/p>","identifier":{"@type":"PropertyValue","name":"OpenAI Foundation","value":"4f16ada0-a2da-4509-9016-ed4879d2fe67"},"datePosted":"2026-09-21","hiringOrganization":{"@type":"Organization","name":"OpenAI Foundation","sameAs":"https://openaifoundation.org/"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"United States"}}],"employmentType":"FULL_TIME","inLanguage":"en-US","url":"https://openaifoundation.org/careers/ai-deployment-engineer-4f16ada0-a2da-4509-9016-ed4879d2fe67"}</script>
