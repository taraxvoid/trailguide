name: CI

# Validation is voidflow's tool-ci.yml: gitleaks, jactionlint and zizmor (when
# workflows change), mise tools (Typst for the PDF render tests), then lint,
# check, test and check:licenses from package.json.

on:
  # Every PR, including ones stacked on feature branches.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A new push cancels older runs of the same PR or branch. "-caller" keeps this
# group distinct from any group the called tool-ci.yml builds from
# github.workflow, which there is still this workflow's name.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    uses: taraxvoid/voidflow/.github/workflows/tool-ci.yml@3f6252e4ab9000744b46d9d4d1a0172ee65cf992 # v0.13.1
