name: CI

on:
  # Every PR, including ones stacked on feature branches.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
           fetch-depth: 0
           persist-credentials: false
        
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            lockfile:
              - 'bun.lock'
            scripts:
              - 'scripts/**'
            workflows:
              - '.github/workflows/**'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      # Installs the Typst pinned in mise.toml so the PDF render tests run instead of skipping.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache NPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install NPM packages
        run: bun install --frozen-lockfile

      # jactionlint comes from mise.toml via mise-action above.
      - name: Lint CI workflows
        if: steps.changes.outputs.workflows == 'true'
        run: bun run lint:actions

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Licenses
        if: steps.changes.outputs.lockfile == 'true' || steps.changes.outputs.scripts == 'true'
        run: bun run check:licenses

      - name: Test
        run: bun run test
