# Local git hooks. The shared voidflow hook set (lefthook/site.yml) runs the
# package.json scripts: `check` (tsc) and `test:unit:precommit` (the suite
# minus the slow files) on pre-commit, `check:licenses` when the lockfile
# changes, and `test:push` (the full suite) on pre-push. Commands below are
# added on top; a remote's commands can't be overridden from here.
#
# Tool versions are pinned in mise.toml (lefthook, gitleaks, actionlint) and
# package.json/bun.lock (biome). Install: `mise install && bun install` (the
# `prepare` script runs `lefthook install`).

remotes:
  - git_url: https://github.com/taraxvoid/voidflow
    ref: v0.12.2 # a release tag, not a SHA; lefthook passes it to `git clone --branch`
    configs:
      - lefthook/site.yml

pre-commit:
  parallel: true
  commands:
    biome-check:
      run: bunx @biomejs/biome check --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,json}"
    gitleaks:
      run: gitleaks protect --staged --redact -v --no-banner
