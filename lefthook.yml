# Local git hooks. Every command below shells out to a binary already on
# PATH — lefthook doesn't manage tool versions itself. Pin those yourself:
#   - biome: pinned in package.json/bun.lock, run via `bunx`
#   - gitleaks: installed locally (see `just doctor`), not version-pinned here
#
# Install: `brew install lefthook && lefthook install`

pre-commit:
  parallel: true
  commands:
    biome-check:
      run: bunx @biomejs/biome check --no-errors-on-unmatched {staged_files}
      glob: "*.{ts,tsx,js,json}"
    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run typecheck
    gitleaks:
      run: gitleaks protect --staged --redact -v --no-banner
    licenses:
      glob: "{package.json,bun.lock,scripts/check-licenses.ts}"
      run: bun run check:licenses

pre-push:
  commands:
    test:
      run: bun run test
