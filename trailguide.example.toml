# Copy to trailguide.toml (per project) or ~/.config/trailguide/config.toml (global).
# `trailguide init` writes the global one for you. A local trailguide.toml is merged over
# the global file: scalar keys override one by one, while the regions,
# [[keywords]], [[board]] and [filter] exclude REPLACE the global ones if the
# local file defines them.

# Uncomment for a self-contained sandbox next to this file (relative paths
# resolve against this file's directory). Default: ~/.local/share/trailguide/trailguide.db
# [db]
# path = "trailguide.db"

# A region is a job market with its own places, work type and resume folder.
# Every keyword is searched in every place. At least one region and one
# keyword are required. The TUI shows one region at a time (G or 1-9 to
# switch); a job matching several regions shows in each.
[region.austin]
work = "in-person"                   # remote | in-person (onsite or hybrid) | any (default)
places = ["Austin, TX", "Round Rock", "Cedar Park"]
# resumes = "resumes/austin"         # optional: default <[resume] dir>/<region name>

# A US-wide remote place also takes listings like "Remote, Texas".
[region.remote]
work = "remote"
places = ["United States"]

# Built in: "Bay Area", "East Bay", "South Bay", "Seattle" and "Omaha metro" cover their
# metro's main towns (a listing must name the state or use a bare town name).

[[keywords]]
role = "Platform Engineer"
trail = "platform"    # optional: tailor these jobs from <region resume folder>/platform.md

[[keywords]]
role = "Security Engineer"
trail = "security"

# Drop listings you never want. Both settings are optional.
[filter]
clearance = "include"            # "exclude" drops listings that require a security clearance
exclude = ["Some Staffing Co"]   # whole-word, case-insensitive; checked in company, title and description

# Company job boards to search in addition to the built-in set (greenhouse,
# lever, ashby, workday). The slug is in the board's URL:
#   boards.greenhouse.io/<slug>   jobs.lever.co/<slug>   jobs.ashbyhq.com/<slug>
#   <slug>.<host>.myworkdayjobs.com/<site>   (workday also needs host and site)
[[board]]
company = "10x Genomics"
ats = "greenhouse"
slug = "10xgenomics"

[[board]]
company = "Cadence"
ats = "workday"
slug = "cadence"
host = "wd1"
site = "External_Careers"

# Search only the [[board]] entries above, not the built-in set.
# [sources]
# builtin_boards = false

# Resume masters for `trailguide tailor`. Default: ~/.config/trailguide/resumes.
# Each region reads <dir>/<region name>/<trail>.md unless it sets `resumes`.
# [resume]
# dir = "resumes"
